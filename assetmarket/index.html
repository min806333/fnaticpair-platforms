<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IndieAsset - 인디게임 에셋 마켓플레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg2:#0c0c1a;--card:#111128;--card2:#161638;
  --bdr:#1e1e3f;--bdr2:#2a2a55;--txt:#e8e8f8;--mut:#5858a0;--sub:#8888c8;
  --pu:#7c3aed;--pu-l:#a855f7;--cy:#06b6d4;--gn:#10b981;
  --am:#f59e0b;--pk:#ec4899;--rd:#ef4444;
  --grad:linear-gradient(135deg,#7c3aed,#06b6d4);
  --r:10px;--r2:6px;--nav:64px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-top:var(--nav)}
a{color:inherit;text-decoration:none}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Inter',sans-serif;outline:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* NAV */
#navbar{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:1000;background:rgba(7,7,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 24px;gap:16px}
.nav-logo{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;cursor:pointer;flex-shrink:0}
.nav-search{flex:1;max-width:400px;position:relative}
.nav-search input{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 40px 8px 14px;color:var(--txt);font-size:14px;transition:border-color .2s}
.nav-search input::placeholder{color:var(--mut)}
.nav-search input:focus{border-color:var(--pu)}
.nav-search button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;color:var(--sub);font-size:16px;padding:0}
.nav-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r2);font-size:14px;font-weight:500;transition:all .2s;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--bdr2);color:var(--sub)}
.btn-ghost:hover{border-color:var(--pu-l);color:var(--pu-l)}
.btn-pu{background:var(--pu);border:1px solid var(--pu);color:#fff}
.btn-pu:hover{background:var(--pu-l);border-color:var(--pu-l)}
.btn-grad{background:var(--grad);border:none;color:#fff;font-weight:600}
.btn-grad:hover{opacity:.9}
.btn-cy{background:transparent;border:1px solid var(--cy);color:var(--cy)}
.btn-cy:hover{background:var(--cy);color:#000}
.btn-gn{background:var(--gn);border:1px solid var(--gn);color:#fff}
.btn-gn:hover{opacity:.85}
.btn-rd{background:var(--rd);border:1px solid var(--rd);color:#fff}
.btn-rd:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 28px;font-size:16px;border-radius:var(--r)}
.cart-btn{position:relative;background:transparent;border:1px solid var(--bdr2);color:var(--sub);padding:8px 12px;border-radius:var(--r2);font-size:18px;transition:all .2s}
.cart-btn:hover{border-color:var(--cy);color:var(--cy)}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--pk);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;border:none;color:#fff;flex-shrink:0}

/* VIEWS */
.view{display:none;min-height:calc(100vh - var(--nav))}
.view.active{display:block}

/* HERO */
.hero{position:relative;overflow:hidden;padding:80px 24px 60px;text-align:center;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(124,58,237,.18) 0%,transparent 70%)}
.hero h1{font-size:clamp(28px,5vw,52px);font-weight:800;line-height:1.15;margin-bottom:16px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--sub);font-size:clamp(14px,2vw,18px);margin-bottom:32px;max-width:540px;margin-left:auto;margin-right:auto}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:48px}
.stats-row{display:flex;gap:32px;justify-content:center;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:12px;color:var(--mut);margin-top:2px}

/* SECTION */
.section{padding:48px 24px;max-width:1200px;margin:0 auto}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.section-hd h2{font-size:22px;font-weight:700}
.section-hd span{font-size:13px;color:var(--sub)}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.cat-card{border-radius:var(--r);padding:24px 20px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;border:1px solid transparent}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.cat-icon{font-size:32px;margin-bottom:12px}
.cat-label{font-size:15px;font-weight:600;margin-bottom:4px}
.cat-count{font-size:12px;opacity:.7}

/* ASSET GRID */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.asset-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.asset-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4);border-color:var(--bdr2)}
.asset-prev{height:160px;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.asset-body{padding:14px}
.asset-badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.badge-cat{background:rgba(124,58,237,.2);color:var(--pu-l);border:1px solid rgba(124,58,237,.3)}
.badge-free{background:rgba(16,185,129,.2);color:var(--gn);border:1px solid rgba(16,185,129,.3)}
.asset-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.asset-author{font-size:12px;color:var(--sub);margin-bottom:10px;cursor:pointer}
.asset-author:hover{color:var(--pu-l)}
.asset-foot{display:flex;align-items:center;justify-content:space-between}
.asset-price{font-size:16px;font-weight:700;color:var(--txt)}
.asset-price.free{color:var(--gn)}
.asset-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}

/* BROWSE */
#v-browse .browse-layout{display:flex;gap:0;min-height:calc(100vh - var(--nav))}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);padding:24px 16px;position:sticky;top:var(--nav);height:calc(100vh - var(--nav));overflow-y:auto}
.sidebar h3{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;margin-top:20px}
.sidebar h3:first-child{margin-top:0}
.filter-btn{display:block;width:100%;text-align:left;background:transparent;color:var(--sub);padding:7px 10px;border-radius:var(--r2);font-size:14px;border:none;transition:all .2s;cursor:pointer;margin-bottom:2px}
.filter-btn:hover{background:var(--card);color:var(--txt)}
.filter-btn.active{background:rgba(124,58,237,.15);color:var(--pu-l);font-weight:600}
.filter-sep{height:1px;background:var(--bdr);margin:16px 0}
.sidebar select{width:100%;background:var(--card);border:1px solid var(--bdr);color:var(--txt);padding:8px 10px;border-radius:var(--r2);font-size:13px}
.browse-main{flex:1;padding:24px;min-width:0}
.browse-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.result-count{font-size:14px;color:var(--sub)}
.browse-search{display:flex;gap:8px;flex:1;max-width:320px}
.browse-search input{flex:1;background:var(--card);border:1px solid var(--bdr);border-radius:var(--r2);padding:8px 12px;color:var(--txt);font-size:14px}
.browse-search input:focus{border-color:var(--pu)}

/* DETAIL */
.detail-wrap{max-width:1100px;margin:0 auto;padding:32px 24px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:24px}
.breadcrumb span{cursor:pointer;transition:color .2s}
.breadcrumb span:hover{color:var(--pu-l)}
.breadcrumb .sep{color:var(--bdr2)}
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
.detail-preview{height:320px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:96px;margin-bottom:24px;border:1px solid var(--bdr)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bdr);margin-bottom:24px}
.tab-btn{background:transparent;color:var(--mut);padding:10px 20px;font-size:14px;font-weight:500;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;cursor:pointer}
.tab-btn.active{color:var(--pu-l);border-bottom-color:var(--pu)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.price-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:24px;position:sticky;top:calc(var(--nav) + 16px)}
.price-big{font-size:32px;font-weight:800;margin-bottom:4px}
.price-big.free{color:var(--gn)}
.price-sub{font-size:13px;color:var(--mut);margin-bottom:20px}
.file-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.file-table td{padding:8px 0;border-bottom:1px solid var(--bdr);color:var(--sub)}
.file-table td:first-child{color:var(--mut);width:40%}
.file-table tr:last-child td{border-bottom:none}
.star-summary{margin-top:20px}
.star-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
.star-bar{flex:1;height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}
.star-bar-fill{height:100%;background:var(--am);border-radius:3px;transition:width .4s}
.author-card{margin-top:20px;background:var(--card2);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .2s}
.author-card:hover{border-color:var(--pu)}
.author-card-inner{display:flex;align-items:center;gap:12px}
.author-av{width:40px;height:40px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.review-item{background:var(--card2);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px}
.review-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.review-author{font-size:14px;font-weight:600}
.review-stars{color:var(--am);font-size:14px}
.review-ago{font-size:12px;color:var(--mut)}
.review-text{font-size:14px;color:var(--sub);line-height:1.6}

/* UPLOAD */
.upload-wrap{max-width:680px;margin:0 auto;padding:40px 24px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-bottom:8px}
.form-input{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:var(--r2);padding:10px 14px;color:var(--txt);font-size:14px;transition:border-color .2s}
.form-input:focus{border-color:var(--pu)}
.form-input::placeholder{color:var(--mut)}
textarea.form-input{resize:vertical;min-height:100px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.engine-toggles{display:flex;gap:8px;flex-wrap:wrap}
.eng-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--sub);font-size:13px;transition:all .2s;cursor:pointer}
.eng-btn.active{background:rgba(124,58,237,.2);border-color:var(--pu);color:var(--pu-l)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:8px}
.emoji-opt{font-size:24px;padding:6px;border-radius:var(--r2);border:1px solid transparent;cursor:pointer;text-align:center;transition:all .2s;background:var(--card2)}
.emoji-opt:hover,.emoji-opt.selected{border-color:var(--pu);background:rgba(124,58,237,.15)}

/* MYPAGE */
.my-wrap{max-width:1100px;margin:0 auto;padding:32px 24px}
.my-header{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:28px;display:flex;align-items:center;gap:20px;margin-bottom:28px}
.my-av{width:64px;height:64px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex-shrink:0}
.my-info h2{font-size:22px;font-weight:700}
.my-info p{font-size:14px;color:var(--sub);margin-top:4px}
.my-stats{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
.my-stat{text-align:center}
.my-stat-n{font-size:20px;font-weight:700;color:var(--pu-l)}
.my-stat-l{font-size:11px;color:var(--mut)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:20px}
.stat-card-n{font-size:28px;font-weight:800;margin-bottom:4px}
.stat-card-l{font-size:13px;color:var(--sub)}
.sales-table{width:100%;border-collapse:collapse;font-size:14px}
.sales-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase}
.sales-table td{padding:10px 12px;border-bottom:1px solid var(--bdr);color:var(--sub)}
.sales-table tr:last-child td{border-bottom:none}

/* CART */
.cart-wrap{max-width:1000px;margin:0 auto;padding:32px 24px}
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
.cart-item{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.cart-prev{width:72px;height:72px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.cart-info{flex:1;min-width:0}
.cart-title{font-size:15px;font-weight:600;margin-bottom:4px}
.cart-author{font-size:12px;color:var(--sub)}
.cart-price{font-size:16px;font-weight:700;color:var(--pu-l);margin-top:6px}
.cart-remove{background:transparent;border:1px solid var(--bdr);color:var(--mut);padding:6px 10px;border-radius:var(--r2);font-size:18px;transition:all .2s;flex-shrink:0}
.cart-remove:hover{border-color:var(--rd);color:var(--rd)}
.order-summary{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:24px;position:sticky;top:calc(var(--nav) + 16px)}
.order-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:var(--sub)}
.order-total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:16px;border-top:1px solid var(--bdr);margin-top:4px}

/* AUTH */
.auth-wrap{min-height:calc(100vh - var(--nav));display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(124,58,237,.1) 0%,transparent 70%)}
.auth-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:40px;width:100%;max-width:420px}
.auth-card h2{font-size:24px;font-weight:800;margin-bottom:6px}
.auth-card p{font-size:14px;color:var(--sub);margin-bottom:28px}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--r2);padding:10px 14px;font-size:13px;color:var(--rd);margin-bottom:16px;display:none}

/* PROFILE */
.profile-wrap{max-width:1000px;margin:0 auto;padding:32px 24px}
.profile-header{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:32px;display:flex;align-items:center;gap:24px;margin-bottom:28px}
.profile-av{width:80px;height:80px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex-shrink:0}
.profile-info h2{font-size:24px;font-weight:700}
.profile-info p{color:var(--sub);margin-top:6px;font-size:14px}
.profile-meta{display:flex;gap:20px;margin-top:12px}
.profile-meta span{font-size:13px;color:var(--mut)}
.profile-meta strong{color:var(--txt)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--bdr2);border-radius:14px;padding:32px;width:100%;max-width:480px;position:relative}
.modal h3{font-size:20px;font-weight:700;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;background:transparent;border:none;color:var(--mut);font-size:20px;cursor:pointer;transition:color .2s}
.modal-close:hover{color:var(--txt)}
.stars-input{display:flex;gap:6px;margin-bottom:20px}
.star-inp{font-size:28px;cursor:pointer;transition:transform .15s;color:var(--bdr2)}
.star-inp.lit{color:var(--am)}
.star-inp:hover{transform:scale(1.2)}

/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border:1px solid var(--bdr2);border-radius:var(--r);padding:12px 18px;font-size:14px;color:var(--txt);animation:slideIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px}
.toast.success{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:var(--gn)}
.toast.error{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:var(--rd)}
.toast.info{border-color:rgba(6,182,212,.4);background:rgba(6,182,212,.1);color:var(--cy)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 24px;color:var(--mut)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty p{font-size:16px}

/* DIVIDER */
.bdr-section{border-top:1px solid var(--bdr);margin:0}

/* RESPONSIVE */
@media(max-width:900px){
  #v-browse .browse-layout{flex-direction:column}
  .sidebar{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--bdr)}
  .detail-grid{grid-template-columns:1fr}
  .cart-layout{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .my-header{flex-direction:column;text-align:center}
}
@media(max-width:600px){
  .asset-grid{grid-template-columns:repeat(2,1fr)}
  .nav-search{display:none}
  .stats-row{gap:20px}
  #navbar{padding:0 12px;gap:8px}
  .section{padding:32px 16px}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
}

/* UTILITY */
.text-grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.text-pu{color:var(--pu-l)}
.text-gn{color:var(--gn)}
.text-am{color:var(--am)}
.text-cy{color:var(--cy)}
.text-sub{color:var(--sub)}
.text-mut{color:var(--mut)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.w100{width:100%}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav id="navbar">

function sanitize(str){
  if(str==null)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function fmt(price){return price===0?'무료':price.toLocaleString('ko-KR')+'원'}
function fmtStars(r){
  const n=Math.round(r*2)/2;
  let s='';
  for(let i=1;i<=5;i++){
    if(i<=n)s+='★';
    else if(i-0.5===n)s+='½';
    else s+='☆';
  }
  return s;
}
function ago(iso){
  const d=new Date(iso),now=new Date();
  const diff=Math.floor((now-d)/1000);
  if(diff<60)return '방금 전';
  if(diff<3600)return Math.floor(diff/60)+'분 전';
  if(diff<86400)return Math.floor(diff/3600)+'시간 전';
  if(diff<2592000)return Math.floor(diff/86400)+'일 전';
  if(diff<31536000)return Math.floor(diff/2592000)+'달 전';
  return Math.floor(diff/31536000)+'년 전';
}

function renderHome(){

  const featured=[...assets].filter(a=>DB.assetRating(a.id)!==null).sort((a,b)=>{
    const ra=DB.assetRating(a.id)||0,rb=DB.assetRating(b.id)||0;

        <div class="stat-item"><div class="stat-num">${sellers}</div><div class="stat-lbl">셀러</div></div>
        <div class="stat-item"><div class="stat-num">${freeCount}</div><div class="stat-lbl">무료 에셋</div></div>
        <div class="stat-item"><div class="stat-num">${(totalDl/1000).toFixed(1)}k</div><div class="stat-lbl">누적 다운로드</div></div>

          ${Object.entries(CATS).map(([k,v])=>`
            <div class="cat-card" style="background:${v.grad.replace('135deg','160deg').replace(/,#/g,',rgba(').replace(/\)/g,',.15)')}" onclick="setCat('${k}');go('browse')">

function renderBrowseGrid(){
  let assets=DB.assets();
  if(ST.cat!=='all')assets=assets.filter(a=>a.category===ST.cat);
  if(ST.price==='free')assets=assets.filter(a=>a.price===0);
  if(ST.price==='paid')assets=assets.filter(a=>a.price>0);
  if(ST.eng!=='all')assets=assets.filter(a=>a.engines&&a.engines.includes(ST.eng));
  if(ST.bsearch){
    const q=ST.bsearch.toLowerCase();
    assets=assets.filter(a=>a.title.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)||(a.tags&&a.tags.some(t=>t.toLowerCase().includes(q))));
  }
  if(ST.sort==='newest')assets.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  else if(ST.sort==='popular')assets.sort((a,b)=>b.downloads-a.downloads);
  else if(ST.sort==='rating')assets.sort((a,b)=>(DB.assetRating(b.id)||0)-(DB.assetRating(a.id)||0));
  else if(ST.sort==='price_asc')assets.sort((a,b)=>a.price-b.price);
  else if(ST.sort==='price_desc')assets.sort((a,b)=>b.price-a.price);

  const grid=document.getElementById('browse-grid');
  const cnt=document.getElementById('result-count');
  if(cnt)cnt.textContent=`${assets.length}개 에셋`;
  if(grid){
    if(!assets.length){
      grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>검색 결과가 없습니다</p></div>`;
    }else{
      grid.innerHTML=assets.map(assetCardHTML).join('');
    }
  }
}

function setCat(c){ST.cat=c;if(document.getElementById('v-browse').classList.contains('active'))renderBrowse();else{go('browse');}}
function setPrice(p){ST.price=p;renderBrowseGrid();document.querySelectorAll('.filter-btn').forEach(b=>{if(b.textContent.trim()===['전체','무료','유료'][['all','free','paid'].indexOf(p)])b.classList.add('active');});}
function setEng(e){ST.eng=e;renderBrowseGrid();}
function setSort(s){ST.sort=s;renderBrowseGrid();}
function setBSearch(v){ST.bsearch=v;renderBrowseGrid();}

  const rating=DB.assetRating(id);

  // Star distribution

      buyBtn=`<button class="btn btn-gn w100" style="margin-bottom:8px" onclick="freeDownload('${id}')">무료 다운로드</button>`;
    }else{

    }

    buyBtn=`<button class="btn btn-gn w100" style="margin-bottom:8px" onclick="freeDownload('${id}')">무료 다운로드</button>`;
  }else{
    const inCart=DB.cart(me.id).includes(id);

      buyBtn=`<button class="btn btn-cy w100" style="margin-bottom:8px" onclick="go('cart')">장바구니에서 보기</button>`;
    }else{
      buyBtn=`<button class="btn btn-pu w100" style="margin-bottom:8px" onclick="addCart('${id}')">장바구니에 담기</button>`;

        <span>${a.title}</span>

      <div class="detail-grid">
        <div>
          <div class="detail-preview" style="background:${cat.grad}">${a.emoji||cat.icon}</div>
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">개요</button>

          </div>
          <div id="tab-overview" class="tab-panel active">
            <p style="color:var(--sub);line-height:1.8;font-size:15px">${a.desc}</p>
            ${a.tags&&a.tags.length?`<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${a.tags.map(t=>`<span style="background:var(--card2);border:1px solid var(--bdr);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--sub)">#${t}</span>`).join('')}</div>`:''}

}

function selectEmoji(e){
  ST.uploadEmoji=e;
  document.querySelectorAll('.emoji-opt').forEach(el=>{el.classList.toggle('selected',el.textContent===e);});
}

function saveUpload(){
  const me=DB.me();
  if(!me)return;
  const title=document.getElementById('up-title').value.trim();
  const cat=document.getElementById('up-cat').value;
  const price=parseInt(document.getElementById('up-price').value)||0;
  const desc=document.getElementById('up-desc').value.trim();
  if(!title){toast('에셋 이름을 입력해주세요','error');return;}
  if(!cat){toast('카테고리를 선택해주세요','error');return;}
  if(!desc){toast('설명을 입력해주세요','error');return;}
  const tags=document.getElementById('up-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const a={
    id:uid(),authorId:me.id,authorName:me.username,
    title,category:cat,price,desc,
    emoji:ST.uploadEmoji,
    engines:ST.uploadEngines.slice(),
    tags,
    fileFormat:document.getElementById('up-fmt').value.trim(),
    fileSize:document.getElementById('up-size').value.trim(),
    version:document.getElementById('up-ver').value.trim()||'1.0.0',
    downloads:0,
    createdAt:new Date().toISOString()
  };
  const arr=DB.assets();
  arr.push(a);
  DB.saveA(arr);
  toast('에셋이 등록되었습니다!','success');
  ST.myTab='uploads';
  go('mypage');
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  if(!email||!pw){err.style.display='block';err.textContent='이메일과 비밀번호를 입력해주세요';return;}
  const h=await hashPw(pw);
  const u=DB.users().find(x=>x.email===email&&x.password===h);
  if(!u){err.style.display='block';err.textContent='이메일 또는 비밀번호가 올바르지 않습니다';return;}
  DB.setSid(u.id);
  toast(`${sanitize(u.username)}님, 환영합니다!`,'success');
  go('home');
}

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pw=document.getElementById('reg-pw').value;
  const err=document.getElementById('reg-err');
  if(!name||!email||!pw){err.style.display='block';err.textContent='모든 항목을 입력해주세요';return;}
  if(pw.length<6){err.style.display='block';err.textContent='비밀번호는 6자 이상이어야 합니다';return;}
  const users=DB.users();
  if(users.find(u=>u.email===email)){err.style.display='block';err.textContent='이미 사용 중인 이메일입니다';return;}
  const h=await hashPw(pw);
  const newUser={id:uid(),username:name,email,password:h,bio:'',createdAt:new Date().toISOString()};
  users.push(newUser);
  DB.saveU(users);
  DB.setSid(newUser.id);
  toast(`${sanitize(name)}님, 회원가입을 축하합니다!`,'success');
  go('home');
}

function doLogout(){
  DB.clearSid();
  toast('로그아웃 되었습니다','info');
  go('home');
}

// CART ACTIONS
// ============================================================
function addCart(id){
  const me=DB.me();
  if(!me){toast('로그인이 필요합니다','error');go('login');return;}
  const c=DB.cart(me.id);
  if(c.includes(id)){toast('이미 장바구니에 있습니다','info');return;}
  c.push(id);
  DB.saveCart(me.id,c);
  toast('장바구니에 담겼습니다','success');
  updateNav();
  // re-render if on detail
  if(document.getElementById('v-detail').classList.contains('active'))renderDetail(ST.viewAsset);
}

function removeCart(id){
  const me=DB.me();
  if(!me)return;
  const c=DB.cart(me.id).filter(x=>x!==id);
  DB.saveCart(me.id,c);
  toast('장바구니에서 제거했습니다','info');
  updateNav();
  renderCart();
}

function freeDownload(id){
  const me=DB.me();
  if(!me){toast('로그인이 필요합니다','error');go('login');return;}
  if(DB.hasPurchased(me.id,id)){toast('이미 다운로드한 에셋입니다','info');return;}
  const p={id:uid(),userId:me.id,assetId:id,price:0,at:new Date().toISOString()};
  const ps=DB.purchases();ps.push(p);DB.saveP(ps);
  const assets=DB.assets();
  const idx=assets.findIndex(a=>a.id===id);
  if(idx!==-1){assets[idx].downloads++;DB.saveA(assets);}
  toast('다운로드가 완료되었습니다!','success');
  if(document.getElementById('v-detail').classList.contains('active'))renderDetail(ST.viewAsset);
}

function checkout(){
  const me=DB.me();
  if(!me)return;
  const cartIds=DB.cart(me.id);
  if(!cartIds.length)return;
  const allAssets=DB.assets();
  const purchases=DB.purchases();
  cartIds.forEach(id=>{
    if(!DB.hasPurchased(me.id,id)){
      const a=allAssets.find(x=>x.id===id);
      if(a){
        purchases.push({id:uid(),userId:me.id,assetId:id,price:a.price,at:new Date().toISOString()});
        const idx=allAssets.findIndex(x=>x.id===id);
        if(idx!==-1)allAssets[idx].downloads++;
      }
    }
  });
  DB.saveP(purchases);
  DB.saveA(allAssets);
  DB.saveCart(me.id,[]);
  toast('구매가 완료되었습니다!','success');
  ST.myTab='downloads';
  go('mypage');
}

// ============================================================
// REVIEW MODAL
// ============================================================
function openReviewModal(assetId){
  const me=DB.me();
  if(!me){toast('로그인이 필요합니다','error');return;}
  ST.rvAsset=assetId;
  ST.rvRating=0;
  document.getElementById('rv-comment').value='';
  renderStarInputs();
  document.getElementById('review-modal').style.display='flex';
}

function closeReviewModal(){
  document.getElementById('review-modal').style.display='none';
  ST.rvAsset=null;ST.rvRating=0;
}

function renderStarInputs(){
  const el=document.getElementById('star-inputs');
  el.innerHTML=[1,2,3,4,5].map(n=>`<span class="star-inp${n<=ST.rvRating?' lit':''}" onclick="setRvStar(${n})" onmouseover="hoverStar(${n})" onmouseout="unhoverStar()">★</span>`).join('');
}

function hoverStar(n){document.querySelectorAll('.star-inp').forEach((s,i)=>s.classList.toggle('lit',i<n));}
function unhoverStar(){document.querySelectorAll('.star-inp').forEach((s,i)=>s.classList.toggle('lit',i<ST.rvRating));}
function setRvStar(n){ST.rvRating=n;renderStarInputs();}

function submitReview(){
  const me=DB.me();
  if(!me||!ST.rvAsset)return;
  if(!ST.rvRating){toast('평점을 선택해주세요','error');return;}
  const comment=document.getElementById('rv-comment').value.trim();
  if(!comment){toast('리뷰 내용을 입력해주세요','error');return;}
  const rv={id:uid(),assetId:ST.rvAsset,userId:me.id,rating:ST.rvRating,comment,at:new Date().toISOString()};
  const rvs=DB.reviews();rvs.push(rv);DB.saveRv(rvs);
  closeReviewModal();
  toast('리뷰가 등록되었습니다!','success');
  renderDetail(ST.rvAsset);
  switchTab('reviews');
}

function deleteAsset(id){
  const me=DB.me();
  if(!me)return;
  const assets=DB.assets().filter(a=>!(a.id===id&&a.authorId===me.id));
  DB.saveA(assets);
  toast('에셋이 삭제되었습니다','info');
  renderMypage();
}

// ============================================================
// TOAST
// ============================================================
function toast(msg,type='info'){
  const container=document.getElementById('toast-container');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  const icon={success:'✓',error:'✕',info:'ℹ'}[type]||'ℹ';
  el.innerHTML=`<span>${icon}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>{el.style.animation='slideIn .3s ease reverse';setTimeout(()=>el.remove(),300);},3000);
}
